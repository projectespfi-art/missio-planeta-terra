<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisió de missions · Planeta Terra</title><style>body{margin:0;background:#071925;color:#eef8fa;font:16px system-ui}header{padding:14px 20px;background:#153747}h1{font-size:21px;margin:0 0 10px}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 15px;background:#295266;border:1px solid #5f9aaa;border-radius:8px;color:white;cursor:pointer;font-weight:bold}button.active{background:#e6ad36;color:#14212b}#game{display:block;width:100%;height:calc(100vh - 130px);min-height:650px;border:0}#source{display:none}</style></head><body><header><h1>🌍 Missió Planeta Terra · Revisió independent</h1><nav id="nav"></nav></header><iframe id="source" src="index.html" title="Font de les missions"></iframe><iframe id="game" title="Missió per revisar"></iframe><script>const source=document.getElementById('source'),game=document.getElementById('game'),nav=document.getElementById('nav');let current=Number(new URLSearchParams(location.search).get('missio'))||1;if(current<1||current>4)current=1;function show(n){try{const html=source.contentWindow.eval('pages['+(n-1)+']');if(typeof html!=='string')throw Error('No disponible');current=n;game.srcdoc=html;history.replaceState(null,'','?missio='+n);[...nav.children].forEach((b,i)=>b.classList.toggle('active',i===n-1))}catch(e){game.srcdoc='<p style="font:18px system-ui;padding:30px">No s’ha pogut carregar la missió. Actualitza la pàgina.</p>'}}for(let i=1;i<=4;i++){const b=document.createElement('button');b.textContent='Missió '+i;b.onclick=()=>show(i);nav.appendChild(b)}source.addEventListener('load',()=>show(current));</script></body></html>
